name: Converter tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb libsndfile1
      - run: python -m pip install -r requirements.txt
      - run: xvfb-run -a python -m unittest discover -s tests -v
